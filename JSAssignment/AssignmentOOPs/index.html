/* -----------------------------------------------------------
   Q1. Student Result Processing (reduce + Classes)
------------------------------------------------------------*/
class Student {
    constructor(name, marks) {
        this.name = name;
        this.marks = marks;
    }

    calculateAverage() {
        return this.marks.reduce((a, b) => a + b, 0) / this.marks.length;
    }

    getGrade() {
        let avg = this.calculateAverage();

        if (avg >= 90) return "A";
        if (avg >= 75) return "B";
        if (avg >= 50) return "C";
        return "F";
    }
}

console.log("----- Q1 Output -----");
const st1 = new Student("Anam", [90, 85, 92]);
const st2 = new Student("Rahul", [70, 60, 75]);
const st3 = new Student("Sneha", [40, 55, 45]);

console.log(st1.name, st1.calculateAverage(), st1.getGrade());
console.log(st2.name, st2.calculateAverage(), st2.getGrade());
console.log(st3.name, st3.calculateAverage(), st3.getGrade());



/* -----------------------------------------------------------
   Q2. Online Food Ordering (map + Error Handling)
------------------------------------------------------------*/
console.log("----- Q2 Output -----");

const menu = {
    pizza: 200,
    burger: 120,
    pasta: 150,
    fries: 80
};

function calculateBill(orderItems) {
    try {
        const prices = orderItems.map(item => {
            if (!menu[item]) throw new Error(`Item not found: ${item}`);
            return menu[item];
        });

        const total = prices.reduce((a, b) => a + b, 0);
        console.log("Total Bill:", total);

    } catch (err) {
        console.log("Error:", err.message);
    }
}

calculateBill(["pizza", "fries"]);
calculateBill(["burger", "icecream"]); // invalid item

function Product(name, price) {

}

    return this.price - (this.price * percent / 100);
};

/* -----------------------------------------------------------
   Q6. E-Commerce Inventory System
------------------------------------------------------------*/
console.log("----- Q6 Output -----");

const products = [
    { id: 1, name: "Laptop", category: "Electronics", price: 50000, stock: 3 },
    { id: 2, name: "Shoes", category: "Fashion", price: 2000, stock: 15 },
    { id: 3, name: "Phone", category: "Electronics", price: 30000, stock: 2 },
    { id: 4, name: "T-shirt", category: "Fashion", price: 500, stock: 30 }
];

function getLowStockProducts() {
    return products.filter(p => p.stock < 5);
}

function sortProductsByPrice() {
    return products.sort((a, b) => a.price - b.price);
}

function calculateTotalInventoryValue() {
    return products.reduce((acc, p) => acc + (p.price * p.stock), 0);
}

function groupByCategory() {
    return products.reduce((group, item) => {
        if (!group[item.category]) group[item.category] = [];
        group[item.category].push(item);
        return group;
    }, {});
}

console.log("Low Stock:", getLowStockProducts());
console.log("Sorted by Price:", sortProductsByPrice());
console.log("Total Inventory Value:", calculateTotalInventoryValue());
console.log("Group by Category:", groupByCategory());



/* -----------------------------------------------------------
   Q7. Banking Application (Private Fields)
------------------------------------------------------------*/
console.log("----- Q7 Output -----");

class BankAccount {
    #balance = 0;

    deposit(amount) {
        this.#balance += amount;
        console.log(`Deposited: ${amount}`);
    }

    withdraw(amount) {
        if (amount > this.#balance) {
            throw new Error("Insufficient balance");
        }
        this.#balance -= amount;
        console.log(`Withdrawn: ${amount}`);
    }

    getBalance() {
        return this.#balance;
    }
}

const acc = new BankAccount();
acc.deposit(500);

try {
    acc.withdraw(200);
    acc.withdraw(400);
} catch (e) {
    console.log("Bank Error:", e.message);
}

console.log("Final Balance:", acc.getBalance());

/* -----------------------------------------------------------
   Q9. Fitness App Analytics
------------------------------------------------------------*/
console.log("----- Q9 Output -----");

class FitnessAnalytics {
    constructor(data) {
        if (data.length === 0) {
            throw new Error("Dataset is empty");
        }
        this.data = data;
    }

    getActiveUsers() {
        return this.data.filter(u => u.steps > 7000);
    }

    getAverageCalories() {
        return this.data.reduce((a, b) => a + b.calories, 0) / this.data.length;
    }

    getUserSummary() {
        return this.data.map(u => `${u.user} burned ${u.calories} calories`);
    }
}

const fitnessData = [
    { user: "A", steps: 8000, calories: 300 },
    { user: "B", steps: 12000, calories: 500 },
    { user: "C", steps: 4000, calories: 200 }
];

const analytics = new FitnessAnalytics(fitnessData);

console.log("Active Users:", analytics.getActiveUsers());
console.log("Avg Calories:", analytics.getAverageCalories());
console.log("User Summary:", analytics.getUserSummary());
