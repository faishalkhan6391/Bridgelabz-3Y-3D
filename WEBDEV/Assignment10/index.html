<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startup Landing Page</title>

    <!-- ✅ Bootstrap 5 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="q1.css" />
  </head>

  <body>
    <!-- ===== HEADER & NAVBAR ===== -->
    <header class="bg-primary text-white">
      <nav class="navbar navbar-expand-lg navbar-dark container">
        <a class="navbar-brand fw-bold" href="#">TechStart</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <!-- ===== HERO SECTION ===== -->
    <main class="bg-light py-5 text-center">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-md-6 mx-auto">
            <h1 class="display-4 fw-bold">Innovate. Build. Launch.</h1>
            <p class="lead">
              Empowering startups with smart technology solutions that grow with
              your business.
            </p>
            <button class="btn btn-primary btn-lg mt-3">Get Started</button>
          </div>
        </div>
      </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="bg-dark text-white text-center py-3">
      <p class="mb-0">© 2025 TechStart — All rights reserved.</p>
    </footer>

    <!-- ✅ Bootstrap JS (for Navbar toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
